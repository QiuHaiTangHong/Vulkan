name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          libxkbcommon-dev libwayland-dev libx11-dev \
          libxcursor-dev libxinerama-dev libxrandr-dev \
          libxi-dev libgl1-mesa-dev libvulkan-dev \
          vulkan-tools libglfw3-dev libglm-dev

    - name: Install LLVM 22 and libc++
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get install -y clang-22 libc++-22-dev libc++abi-22-dev

    - name: Run Sync Deps Script
      run: |
        if [ -f "sync_deps.py" ]; then
          python3 sync_deps.py
        fi

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang-22 \
          -DCMAKE_CXX_COMPILER=clang++-22 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++"

    - name: Build
      run: cmake --build build
